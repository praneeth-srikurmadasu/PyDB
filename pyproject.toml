[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pydb"
version = "0.1.0"
description = "A disk-based relational database engine in pure Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Praneeth" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "pytest-benchmark==5.3.1",
    "ruff==0.17.5",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
include = ["pydb*"]

[tool.setuptools.package-data]
pydb = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pydb", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
